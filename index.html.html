let R3,S3,C3,G3,RY=.6,dragX=null;
function init3d(){if(R3||!window.THREE)return;const T=THREE;R3=new T.WebGLRenderer({antialias:true});R3.setPixelRatio(Math.min(devicePixelRatio,2));R3.setClearColor(0x0B1020);S3=new T.Scene();C3=new T.PerspectiveCamera(35,1,.1,50);C3.position.set(0,.3,8.5);
S3.add(new T.AmbientLight(0xffffff,.7));const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(3,4,6);S3.add(dl);G3=new T.Group();S3.add(G3);
const el=R3.domElement;el.style.touchAction='pan-y';el.onpointerdown=e=>{dragX=e.clientX;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(dragX!=null){RY+=(e.clientX-dragX)*.012;dragX=e.clientX}};el.onpointerup=()=>dragX=null;
(function L(){requestAnimationFrame(L);if(!el.isConnected)return;if(dragX==null)RY+=.003;G3.rotation.y=RY;(G3.userData.fans||[]).forEach(f=>f.rotation.z+=.06);R3.render(S3,C3)})()}
function build3d(){if(!R3)return;const T=THREE;while(G3.children.length){G3.remove(G3.children[0])}const FANS=G3.userData.fans=[];
const g=k=>CFG[k]&&part(CFG[k]),cs=g('case'),mb=g('mb'),gpu=g('gpu'),cl=g('cool'),ram=g('ram'),psu=g('psu'),cpu=g('cpu'),ssd=g('ssd');
const col=cs?cs.rgb:'#1F5BFF',M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.4},o||{})),E=c=>new T.MeshBasicMaterial({color:c});
const mk=(w,h,d,m)=>new T.Mesh(new T.BoxGeometry(w,h,d),m),bx=(w,h,d,m,x,y,z)=>{const b=mk(w,h,d,m);b.position.set(x,y,z);G3.add(b);return b};
const fan=(r,c)=>{const f=new T.Group();f.add(new T.Mesh(new T.TorusGeometry(r,.03,8,24),E(c)));for(let i=0;i<5;i++){const a=i*1.2566,b=mk(r*.85,.07,.02,M('#2a3150'));b.rotation.z=a;b.position.set(Math.cos(a)*r*.42,Math.sin(a)*r*.42,0);f.add(b)}FANS.push(f);return f};
const[W,H,D]={ATX:[3,3.6,1.6],mATX:[2.6,3,1.4],ITX:[1.9,2.6,1.2]}[cs?cs.ff:'ATX'];
/* Boîtier : arêtes colorées, vitre latérale, fond sombre, ventilateurs RGB en façade */
G3.add(new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(W,H,D)),new T.LineBasicMaterial({color:col})));
bx(W,H,.02,M('#88aaff',{transparent:true,opacity:.07}),0,0,D/2);bx(W,H,.04,M('#0f1530'),0,0,-D/2);
if(cs){const n=H>3.2?3:2;for(let i=0;i<n;i++){const pv=new T.Group(),f=fan(Math.min(.4,D/2-.1),col);pv.add(f);pv.rotation.y=Math.PI/2;pv.position.set(-W/2+.08,(i-(n-1)/2)*(H*.3),.0);G3.add(pv)}}
if(psu)bx(W-.3,.5,D*.85,M('#151a30'),0,-H/2+.32,-.05);
const mm={ATX:2.2,mATX:1.8,ITX:1.3}[mb?mb.ff:'ATX'],mx=W/2-mm/2-.15,my=H/2-mm/2-.15,z0=-D/2+.06;
if(mb){bx(mm,mm,.05,M('#1a2240'),mx,my,z0);bx(.5,.12,.08,M('#555d7a'),mx,my-mm*.12,z0+.06)}
if(cpu)bx(.32,.32,.06,M('#c9cfe0'),mx,my+mm*.15,z0+.06);
if(cl){const cx=mx,cy=my+mm*.15;if(cl.type==='air'){const hz=cl.h/180*D*.55;bx(.75,.75,hz,M('#9aa3bd'),cx,cy,z0+.06+hz/2);const f=fan(.3,col);f.position.set(cx,cy,z0+.06+hz+.01);G3.add(f)}
else{const pm=new T.Mesh(new T.CylinderGeometry(.22,.22,.16,20),M('#1b2140'));pm.rotation.x=Math.PI/2;pm.position.set(cx,cy,z0+.14);G3.add(pm);const rw=cl.rad/240*1.3;bx(rw,.2,.5,M('#222a48'),0,H/2-.18,-.05);for(let i=0;i<cl.rad/120;i++){const pv=new T.Group(),f=fan(.22,col);pv.add(f);pv.rotation.x=Math.PI/2;pv.position.set((i-(cl.rad/120-1)/2)*.46,H/2-.3,-.05);G3.add(pv)}}}
if(ram)for(let i=0;i<2;i++){const x=mx+mm*.24+i*.13,y=my+mm*.12;bx(.07,.8,.2,M('#20284a'),x,y,z0+.14);bx(.075,.8,.03,E(col),x,y,z0+.25)}
if(gpu){const L=gpu.len/360*mm*.95,x=mx+mm/2-L/2-.08,y=my-mm*.2;bx(L,.75,.25,M('#10142a'),x,y,z0+.3);bx(L,.04,.27,E(gpu.rgb),x,y+.39,z0+.3);const n=L>1.6?3:2;for(let i=0;i<n;i++){const f=fan(.25,gpu.rgb);f.position.set(x-L/2+L*(i+.5)/n,y,z0+.44);G3.add(f)}}
if(ssd)bx(.6,.07,.4,M('#3a4263'),-W/2+.6,-H/2+.75,-.3)}
function mount3d(){const c=$('#c3d');if(!c)return;init3d();if(!R3){c.innerHTML='<p class="mut" style="padding:20px">Aperçu 3D indisponible sur cet appareil.</p>';return}c.append(R3.domElement);const w=c.clientWidth||320;R3.setSize(w,w);build3d()}

/* Import de prix marché : [{name, source, price}] — point d'entrée commun au CSV collé et au flux JSON */
function importPrices(rows){let n=0;const T=new Set();rows.forEach(r=>{const q=String(r.name).trim().toLowerCase(),x=DB.parts.find(y=>q&&(y.name.toLowerCase().includes(q)||q.includes(y.name.toLowerCase()))),v=+r.price;if(!x||!(v>0&&v<1e5))return;const s=x.src.find(y=>y.n===r.source);if(s){s.p=v;s.t=Date.now()}else x.src.push({n:r.source,p:v,t:Date.now()});T.add(x);n++});T.forEach(snap);DB.cfg.updated=Date.now();save();return n}
/* Flux marchands : un ou plusieurs JSON [{name,source?,price}] (un par ligne), relus toutes les 5 min. Chaque flux = un adaptateur côté serveur. */
async function pullFeed(q){const us=(DB.cfg.feed||'').split('\n').map(x=>x.trim()).filter(u=>/^https:\/\//.test(u));if(!us.length){q||toast("Renseignez au moins une URL de flux.");return}let n=0,ko=0;for(const u of us){try{const j=await(await fetch(u)).json();n+=importPrices(j.map(r=>({source:new URL(u).host,...r})))}catch(e){ko++}}if(!q)toast(n+" prix mis à jour"+(ko?` · ${ko} flux injoignable(s)`:""));if(n)render()}

const fld=(l,k,v,st)=>`<div><label class="mut" style="font-size:.85rem">${l}</label><input type="number" step="${st||1}" min="0" value="${v}" data-set="${k}"></div>`;
/* Composants PC : coefficient fournisseur, marges par catégorie, prix d'achat et stocks */
const partsAdmin=()=>{const c=AD.pc||'cpu',L=DB.parts.filter(p=>p.cat===c);return`<div class="card" style="margin-bottom:16px"><h3>Tarification</h3><p class="mut" style="margin-top:4px">Prix de vente = prix d'achat × coefficient fournisseur × (1 + marge %). Une hausse fournisseur de 5 % : coefficient 1,05.</p><div class="grid g5" style="margin-top:12px">${fld('Coefficient fournisseur','coef',DB.cfg.coef,.01)}${fld('Montage et tests (€)','assembly',DB.cfg.assembly)}${CATS.map(([k,l])=>fld('Pose pièce fournie : '+l+' (€)','lab.'+k,DB.cfg.lab[k])).join('')}${CATS.map(([k,l])=>fld('Marge '+l+' (%)','m.'+k,DB.cfg.m[k])).join('')}</div></div>
<div class="card" style="margin-bottom:16px"><h3>Prix du marché</h3><p class="mut" style="margin-top:4px">Plusieurs sources par pièce : l'estimation écarte les valeurs aberrantes (±12 % de la médiane) et ignore les prix trop anciens. Dernière mise à jour : ${new Date(DB.cfg.updated).toLocaleString('fr-FR')}.</p><div class="grid g5" style="margin:12px 0"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" style="width:auto;min-height:0" data-set="auto" ${DB.cfg.auto?'checked':''}> Vendre au prix marché</label>${fld('Péremption des prix (heures)','maxAge',DB.cfg.maxAge)}<div style="grid-column:span 2"><label class="mut" style="font-size:.85rem">Flux de prix marchands (JSON, un par ligne)</label><textarea rows="2" data-set="feed" placeholder="Une URL de flux JSON par ligne">${esc(DB.cfg.feed)}</textarea></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" data-act="pfeed">Actualiser depuis le flux</button><button class="btn" data-act="pimp">Importer des prix (CSV)</button><button class="btn" data-act="psim">Simuler une variation (démo)</button></div></div>
<div class="tabs">${CATS.map(([k,l])=>`<button class="tab ${k===c?'on':''}" data-act="pcat" data-v="${k}">${l}</button>`).join('')}</div>
<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>${CATS.find(x=>x[0]===c)[1]} (${L.length})</h3><button class="btn p" data-act="add">${ic('plus')} Ajouter</button></div>
<div class="card tbl"><table><tr><th>Nom</th><th>Achat</th><th>Marché</th><th>Tendance 7 j</th><th>Marge</th><th>Vente</th><th>Stock</th><th>Compatibilité</th><th></th></tr>${L.map(x=>`<tr><td>${esc(x.name)}</td><td>${eur(x.buy)}</td><td>${mkt(x)}</td><td>${trd(x)}</td><td>${x.mg??DB.cfg.m[c]} %${x.mg==null?' <small class="mut">(cat.)</small>':''}</td><td><b>${eur(sp(x))}</b></td><td>${x.stock}</td><td><small class="mut">${esc(specs(x))}</small></td><td style="white-space:nowrap"><button class="btn sm" data-act="psrc" data-v="${x.id}" aria-label="Prix du marché">€</button> <button class="btn sm" data-act="edit" data-v="${x.id}" aria-label="Modifier">${ic('edit')}</button> <button class="btn sm d" data-act="del" data-v="${x.id}" aria-label="Supprimer">${ic('trash')}</button></td></tr>`).join('')}</table></div>`};
const admin=()=>{if(!isAuth())return login();const T=[['dash','Tableau de bord','dash'],['repairs','Réparations','wr'],['parts','Composants PC','cpu'],['products','Produits','box'],['orders','Demandes','list']];
return`<div class="wrap adm"><aside><div class="side">${T.map(t=>`<button class="${AD.tab===t[0]?'on':''}" data-act="tab" data-v="${t[0]}">${ic(t[2])}${t[1]}</button>`).join('')}<button data-act="pwd">Mot de passe</button><button data-act="logout">Se déconnecter</button></div></aside><section>${CRED.h===DEF?'<p class="warn" style="margin:0 0 14px">Mot de passe initial encore actif : changez-le avec le bouton « Mot de passe ».</p>':''}${AD.tab==='dash'?dash():AD.tab==='parts'?partsAdmin():AD.tab==='orders'?`<h3 style="margin-bottom:14px">Demandes clients</h3><div class="card">${ordersTbl(DB.orders)}</div>`:crud(AD.tab)}</section></div>`};

/* ---------- 5. ROUTEUR + ÉVÉNEMENTS ---------- */
const VIEWS={'':home,devis,pc:pcView,boutique:shop,admin};
function render(){const r=(location.hash.replace('#/','')||'').split('/')[0];$('#app').innerHTML=(VIEWS[r]||home)();document.querySelectorAll('nav.m a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===r));$('#nav').classList.remove('open');if(r==='pc')mount3d()}
addEventListener('hashchange',()=>{scrollTo(0,0);render()});setInterval(()=>pullFeed(1),3e5);
$('#bg').onclick=()=>$('#nav').classList.toggle('open');
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,v=t.dataset.v;if(ADM.has(a)&&a!=='logout'){if(!isAuth()){toast('Session expirée. Reconnectez-vous.');return render()}touch()}
if(a==='mbg'){if(e.target===t)closeM();return}
if(a==='mbg2')return closeM();
if(a==='wb'){WZ={b:v,m:null,r:null}}else if(a==='wm')WZ.m=v;else if(a==='wr'){WZ.r=v;WZ.q='qualite'}else if(a==='wq')WZ.q=v;else if(a==='wz0'){e.preventDefault();WZ={b:null,m:null,r:null}}
else if(a==='book'){const r=DB.repairs.find(x=>x.id==v);const q=WZ.q||'qualite';return order(`${r.device} – ${r.type} [${QUAL[q].n}]${t.dataset.mail?' (correspondance)':' (rendez-vous)'}`,qp(r,q))}
else if(a==='pd')return prodModal(v);
else if(a==='buy'){const p=DB.products.find(x=>x.id==v);closeM();return order(p.title,p.price,'',p.id)}
else if(a==='login')return doLogin();
else if(a==='logout'){try{sessionStorage.removeItem('kt_exp')}catch(x){}}else if(a==='pwd')return pwdForm();
else if(a==='tab')AD.tab=v;else if(a==='pcat')AD.pc=v;else if(a==='pst')ST=+v;else if(a==='pnx')ST=Math.min(7,ST+1);else if(a==='ppv')ST=Math.max(0,ST-1);
else if(a==='ppick'){const k=CATS[ST][0];if(CFG[k]==v)delete CFG[k];else CFG[k]=+v}else if(a==='prm')delete CFG[v];else if(a==='pall')ALLOWN=!ALLOWN;
else if(a==='pown'){const k=CATS[ST][0],ex={...DB.parts.find(x=>x.cat===k),...OWN[k],id:'own:'+k,cat:k,own:true,name:OWN[k]?OWN[k].name:'',buy:0,mg:null};return form('Je fournis : '+CATS[ST][1],[{k:'name',l:'Marque et modèle',req:1},...pf(k)],ex,o=>{OWN[k]={...o,own:true};CFG[k]='own:'+k;render()})}
else if(a==='pfeed')return pullFeed();else if(a==='pimp')return importModal();else if(a==='psrc')return srcModal(v);
else if(a==='psim'){DB.parts.forEach(p=>p.src.forEach(x=>{x.p=Math.round(x.p*(1+(Math.random()-.45)*.08)*100)/100;x.t=Date.now()}));DB.parts.forEach(snap);DB.cfg.updated=Date.now();save();toast("Variation de marché simulée")}
else if(a==='pvalid'){const tot=CATS.reduce((x,[c])=>x+sp(part(CFG[c])),DB.cfg.assembly);const n=CATS.filter(([c])=>part(CFG[c]).own).length;return order(`PC sur mesure (8 pièces${n?`, dont ${n} fournie${n>1?'s':''} par le client`:''})`,tot,CATS.map(([c])=>part(CFG[c]).name+(part(CFG[c]).own?' [FOURNI PAR LE CLIENT]':'')).join(' · '))}
else if(a==='add'||a==='edit'){const k=AD.tab,ex=a==='edit'?DB[k].find(x=>x.id==v):(k==='parts'?{cat:AD.pc||'cpu',buy:0,stock:10,mg:null}:k==='repairs'?{pc:0,price:0,po:0,time:30}:{price:0,stock:0,state:'Neuf',emoji:'📦'});
return form(a==='add'?'Ajouter':'Modifier',FR[k],ex,o=>{if(!isAuth())return render();if(k==='parts')o.mg=o.mg===''||o.mg==null?null:+o.mg;if(a==='add'){o.id=Date.now();DB[k].unshift(o)}else DB[k]=DB[k].map(x=>x.id==o.id?o:x);save();toast('Enregistré');render()})}
else if(a==='del')return ask('Supprimer cet élément définitivement ?',()=>{DB[AD.tab]=DB[AD.tab].filter(x=>x.id!=v);save();toast('Élément supprimé');render()});
else if(a==='delo')return ask('Supprimer cette demande définitivement ?',()=>{DB.orders=DB.orders.filter(o=>o.id!=v);save();toast('Demande supprimée');render()});
render()});
const IN={q:v=>SH.q=v,mq:v=>WZ.mq=v,aq:v=>AD.rq=v};
document.addEventListener('input',e=>{const t=e.target;if(IN[t.id]){IN[t.id](t.value);const p=t.selectionStart;render();const n=$('#'+t.id);n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const t=e.target;if((t.dataset.set||t.dataset.st)&&!isAuth())return render();if(t.dataset.f){SH[t.dataset.f]=t.value;render()}if(t.dataset.set){const k=t.dataset.set;if(k.startsWith('m.'))DB.cfg.m[k.slice(2)]=+t.value;else if(k.startsWith('lab.'))DB.cfg.lab[k.slice(4)]=+t.value;else DB.cfg[k]=k==='feed'?t.value.trim():k==='auto'?t.checked:+t.value;save();toast('Tarifs recalculés');render()}if(t.dataset.st){DB.orders.find(o=>o.id==t.dataset.st).status=t.value;save();toast('Statut mis à jour')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset?.act==='pd')e.target.click();if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.id==='pw')doLogin()});
render();
</script>
</body>
</html>
